<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0f1a">
<title>LA CLÉ · Théorie & impro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Clé">
<style>
:root{
  --bg:#0d0f1a; --bg2:#141830; --card:#191e38; --card2:#222a4d;
  --ink:#eef0ff; --mut:#a6adcf; --dim:#6f78a0;
  --gold:#f3c34a; --gold2:#ffd76b; --goldsoft:#f6d98a;
  --teal:#39d6c0; --violet:#9d7bff; --grn:#46d38a; --red:#ff6b6b; --coral:#ff7a5c;
  --line:#2b3358; --line2:#39406b;
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --r:16px; --r2:12px; --r3:9px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 460px at 50% -12%, #1c2145 0%, var(--bg) 58%) fixed;
  color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
#app{max-width:600px; margin:0 auto; padding:0 13px calc(84px + env(safe-area-inset-bottom)); }
h1{font-size:22px; margin:16px 0 4px} h2{margin:0}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
select{font-family:inherit}

/* ---------- header ---------- */
header{position:sticky; top:0; z-index:30; background:linear-gradient(180deg,rgba(13,15,26,.96),rgba(13,15,26,.82)); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:calc(8px + env(safe-area-inset-top)) 13px 8px; }
.hbar{max-width:600px; margin:0 auto; display:flex; align-items:center; gap:10px}
.logo{display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.5px; font-size:17px}
.logo .k{width:26px;height:26px; display:grid; place-items:center; background:linear-gradient(135deg,var(--gold),var(--coral)); color:#241a05; border-radius:8px; font-size:15px; box-shadow:0 3px 10px rgba(243,195,74,.35)}
.logo b{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hspace{flex:1}
#nsToggle{font-size:11px; font-weight:700; color:var(--gold); border:1px solid var(--line2); border-radius:20px; padding:5px 10px; background:var(--card)}
.rankchip{text-align:right}
.rankchip #rankName{font-size:11px; font-weight:700; color:var(--gold2)}
.xpwrap{display:flex; align-items:center; gap:6px}
#xpNum{font-size:10px; color:var(--dim)}
.xptrack{width:64px; height:5px; background:var(--line); border-radius:4px; overflow:hidden}
#xpBar{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--coral)); border-radius:4px; transition:width .5s}

/* ---------- bottom nav ---------- */
#nav{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:center; gap:2px;
  background:linear-gradient(0deg,rgba(13,15,26,.98),rgba(13,15,26,.9)); backdrop-filter:blur(12px);
  border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom)); }
.nav-item{flex:1; max-width:110px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border-radius:12px; color:var(--dim); transition:.15s}
.nav-item .ni-e{font-size:19px; filter:grayscale(.4) opacity(.7); transition:.15s}
.nav-item .ni-t{font-size:10px; font-weight:600}
.nav-item.active{color:var(--gold2)}
.nav-item.active .ni-e{filter:none; transform:translateY(-1px)}
.nav-item.active{background:rgba(243,195,74,.08)}

/* ---------- generic ---------- */
.v-head h1{margin-top:14px}
.v-sub{color:var(--mut); font-size:13.5px; line-height:1.5; margin:4px 0 14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:0 0 14px; box-shadow:var(--shadow)}
.hint{color:var(--mut); font-size:12.5px; line-height:1.55; background:var(--bg2); border:1px solid var(--line); border-radius:var(--r3); padding:10px 12px; margin:10px 0}
.hint b{color:var(--ink)}
.muted{color:var(--dim); font-size:13px}
.lbl{font-size:11px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; margin:4px 0 7px}
.btn{background:var(--card2); border:1px solid var(--line2); color:var(--ink); font-weight:600; font-size:13.5px; padding:10px 14px; border-radius:11px; transition:.12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--coral)); color:#2a1d04; border:none}
.btn.ghost{background:transparent}
.btn.ghost.on{background:rgba(243,195,74,.14); border-color:var(--gold); color:var(--gold2)}
.btn.big{width:100%; padding:14px; font-size:15px; margin-top:14px}
.btn.ok{background:rgba(70,211,138,.16); border-color:var(--grn); color:var(--grn)}
.btn.ko{background:rgba(255,107,107,.14); border-color:var(--red); color:var(--red)}
.btn:disabled{opacity:.4}
.btn.flash{animation:fl .25s}
@keyframes fl{50%{background:var(--gold);color:#2a1d04}}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.btnrow2{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.mini{background:var(--card2); border:1px solid var(--line2); color:var(--gold2); border-radius:8px; padding:3px 9px; font-size:12px; font-weight:700}
.mini.flash{background:var(--gold);color:#2a1d04}

/* ---------- SEGMENTS ---------- */
.seg{display:flex; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:3px; margin:0 0 14px; gap:3px}
.seg.small,.seg.tiny{margin:10px 0}
.seg-b{flex:1; padding:9px; border-radius:9px; font-size:13px; font-weight:600; color:var(--mut)}
.seg.tiny .seg-b{padding:7px; font-size:12px}
.seg-b.on{background:var(--card2); color:var(--gold2); box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* ---------- key/type buttons ---------- */
.kbtns{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:6px}
.kbtn{padding:9px 0; background:var(--bg2); border:1px solid var(--line); border-radius:10px; font-weight:700; font-size:14px; color:var(--ink)}
.kbtn.on{background:linear-gradient(135deg,var(--gold),var(--coral)); color:#2a1d04; border:none}
.tbtns{display:flex; flex-wrap:wrap; gap:6px}
.tbtn{padding:8px 12px; background:var(--bg2); border:1px solid var(--line); border-radius:20px; font-size:12.5px; font-weight:600; color:var(--mut)}
.tbtn.on{background:rgba(243,195,74,.16); border-color:var(--gold); color:var(--gold2)}

/* ---------- SOCLE ---------- */
.hero{background:linear-gradient(150deg,#20264d,#171c38); border:1px solid var(--line2); border-radius:var(--r); padding:18px; margin:16px 0; box-shadow:var(--shadow); position:relative; overflow:hidden}
.hero:after{content:"🎼"; position:absolute; right:-6px; top:-14px; font-size:88px; opacity:.06}
.hero-title{font-size:20px; font-weight:800; line-height:1.2}
.hero-sub{color:var(--mut); font-size:13px; margin-top:5px; max-width:90%}
.prog{margin:15px 0 13px}
.prog-bar{height:8px; background:var(--bg); border-radius:6px; overflow:hidden; border:1px solid var(--line)}
.prog-bar span{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--coral)); border-radius:6px; transition:width .6s}
.prog-txt{font-size:11.5px; color:var(--dim); margin-top:6px}
.cta{width:100%; background:linear-gradient(135deg,var(--gold),var(--coral)); color:#2a1d04; font-weight:800; font-size:15px; padding:14px; border-radius:12px; box-shadow:0 6px 18px rgba(243,195,74,.3)}
.cta:active{transform:scale(.98)}
.chap{margin:18px 0}
.chap-h{display:flex; align-items:center; gap:11px; margin-bottom:10px}
.chap-e{font-size:22px; width:40px; height:40px; display:grid; place-items:center; background:var(--card); border:1px solid var(--line); border-radius:11px}
.chap-t{font-weight:700; font-size:15px}
.chap-s{font-size:11.5px; color:var(--dim)}
.chap-c{margin-left:auto; font-size:11px; font-weight:700; color:var(--gold2); background:rgba(243,195,74,.1); padding:4px 8px; border-radius:20px}
.lesson-list{display:flex; flex-direction:column; gap:7px}
.lesson{display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:left; transition:.12s}
.lesson:active{transform:scale(.99); background:var(--card2)}
.lesson.done{border-color:rgba(70,211,138,.35)}
.l-check{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line2); display:grid; place-items:center; font-size:12px; color:var(--grn); flex:0 0 auto}
.lesson.done .l-check{background:rgba(70,211,138,.15); border-color:var(--grn)}
.l-body{flex:1; min-width:0}
.l-title{display:block; font-weight:600; font-size:14.5px}
.l-sub{display:block; font-size:11.5px; color:var(--dim); margin-top:1px}
.l-arrow{color:var(--dim); font-size:20px}

/* ---------- overlay / sheet ---------- */
#overlay{position:fixed; inset:0; z-index:60; background:rgba(6,7,14,.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:.2s}
#overlay.open{opacity:1; pointer-events:auto}
.sheet{position:absolute; left:0; right:0; bottom:0; top:14px; max-width:600px; margin:0 auto; background:var(--bg); border-radius:20px 20px 0 0; border:1px solid var(--line2); transform:translateY(100%); transition:transform .25s cubic-bezier(.3,.9,.3,1); display:flex; flex-direction:column}
#overlay.open .sheet{transform:translateY(0)}
.sheet-head{display:flex; align-items:center; gap:10px; padding:14px 15px; border-bottom:1px solid var(--line); position:sticky; top:0}
.back{color:var(--gold2); font-weight:600; font-size:14px}
.sheet-chap{font-size:12px; color:var(--dim); margin-left:auto}
.sheet-body{overflow-y:auto; padding:16px 16px calc(30px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch}
.l-h{font-size:22px; font-weight:800}
.l-sub2{color:var(--mut); font-size:13.5px; margin:3px 0 14px}
.keyidea{background:linear-gradient(135deg,rgba(243,195,74,.14),rgba(255,122,92,.08)); border:1px solid rgba(243,195,74,.3); border-radius:12px; padding:13px 14px; font-size:14px; font-weight:600; line-height:1.5; color:var(--gold2); margin-bottom:16px}
.prose{font-size:14.5px; line-height:1.62; color:#dbe0f7}
.prose p{margin:0 0 12px}
.prose b{color:#fff}
.prose ul{margin:0 0 12px; padding-left:20px}
.prose li{margin:5px 0}
.prose .tip{background:var(--bg2); border-left:3px solid var(--gold); border-radius:0 9px 9px 0; padding:10px 13px; font-size:13.5px; color:var(--mut)}
.prose .tip b{color:var(--gold2)}
.formula{background:var(--card2); border:1px solid var(--line2); border-radius:10px; padding:12px; text-align:center; font-weight:800; font-size:16px; letter-spacing:.5px; color:var(--gold2); margin:6px 0 14px !important}
.demo{margin:14px 0}
.demo.big{margin:8px 0 4px}
.cap{font-size:11.5px; color:var(--dim); margin-bottom:5px; text-align:center}
.two{display:grid; gap:14px}

/* ---------- quiz ---------- */
.quiz{margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px}
.q-q{font-weight:700; font-size:15px; margin-bottom:12px; line-height:1.4}
.q-choices{display:flex; flex-direction:column; gap:8px}
.q-c{text-align:left; padding:13px; background:var(--bg2); border:1px solid var(--line2); border-radius:11px; font-size:14px; font-weight:500; transition:.12s}
.q-c:active{transform:scale(.99)}
.q-c.ok{background:rgba(70,211,138,.18); border-color:var(--grn); color:#bff5d8}
.q-c.ko{background:rgba(255,107,107,.15); border-color:var(--red); color:#ffc6c6}
.q-fb{margin-top:6px}
.fb-ok,.fb-ko{border-radius:11px; padding:12px; font-size:13.5px; line-height:1.5; margin-top:12px}
.fb-ok{background:rgba(70,211,138,.12); border:1px solid rgba(70,211,138,.4); color:#c7f5df}
.fb-ko{background:rgba(255,107,107,.1); border:1px solid rgba(255,107,107,.35); color:#ffd2d2}

/* ---------- IMPRO ---------- */
.chip-row{display:flex; flex-wrap:wrap; gap:7px; min-height:34px; align-items:center; margin-bottom:12px}
.chip{background:linear-gradient(135deg,rgba(243,195,74,.2),rgba(255,122,92,.14)); border:1px solid rgba(243,195,74,.4); color:var(--gold2); font-weight:700; padding:7px 11px; border-radius:20px; font-size:13.5px}
.rl-in{width:100%; background:var(--bg2); border:1px solid var(--line2); color:var(--ink); border-radius:10px; padding:11px 12px; font-size:14.5px; margin-bottom:8px; font-family:inherit}
.rl-in::placeholder{color:var(--dim)}
.rl-in:focus{outline:none; border-color:var(--gold2)}
.addrow{display:flex; gap:8px}
.addrow select{flex:1; background:var(--bg2); border:1px solid var(--line2); color:var(--ink); border-radius:10px; padding:10px; font-size:14px}
#cRoot{flex:1.2}
.preset-lbl{font-size:11px; color:var(--dim); margin:14px 0 8px; text-transform:uppercase; letter-spacing:.5px}
.presets{display:flex; flex-direction:column; gap:7px}
.pre{text-align:left; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--mut); font-weight:600}
.pre:active{background:var(--card2)}
.result{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.res-key{background:linear-gradient(150deg,#22284f,#181d3a); border:1px solid var(--line2); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.rk-lbl{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim)}
.rk-val{font-size:28px; font-weight:800; background:linear-gradient(90deg,var(--gold2),var(--coral));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; margin:2px 0 6px}
.rk-rel{font-size:12.5px; color:var(--mut); line-height:1.5}
.warn{background:rgba(255,122,92,.1); border:1px solid rgba(255,122,92,.35); color:#ffcdbf; border-radius:11px; padding:11px 13px; font-size:12.5px; line-height:1.5; margin-top:12px}
.res-block{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-top:14px}
.rb-h{font-weight:700; font-size:14px; margin-bottom:12px; color:var(--gold2)}
.notes-line{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:9px 0; font-size:15px}
.nl-lbl{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); width:48px; flex:0 0 auto}
.notes b{font-weight:700}
.notes.hot b{color:var(--gold2)}
.notes.target b{color:var(--teal)}
.tag{font-size:11px; color:var(--dim); font-style:italic}
.tag b{color:var(--mut)}
.sub2{font-size:12px; color:var(--dim); font-weight:700; margin:14px 0 8px; text-transform:uppercase; letter-spacing:.4px}
.pcards{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
.pcard{flex:0 0 auto; background:var(--bg2); border:1px solid var(--line2); border-radius:11px; padding:9px 12px; min-width:78px; text-align:center}
.pc-name{font-weight:800; color:var(--gold2); font-size:14px}
.pc-notes{font-size:12px; color:var(--mut); margin-top:3px}
.diag-wrap{margin:12px 0}
.diag-lbl{font-size:12px; font-weight:700; color:var(--mut); margin-bottom:6px}
.tips ul{margin:0; padding-left:18px; font-size:13.5px; line-height:1.6; color:#dbe0f7}
.tips li{margin:6px 0}
.tips b{color:#fff}

/* ---------- tables ---------- */
.tbl{width:100%; border-collapse:collapse; font-size:13.5px; margin:6px 0}
.tbl th{text-align:left; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:8px; border-bottom:1px solid var(--line2)}
.tbl td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45}
.tbl td b{color:var(--gold2)}
.chords .rom{font-weight:800; color:var(--violet); width:44px}
.scale-notes{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0}
.sn{background:var(--card2); border:1px solid var(--line2); border-radius:9px; padding:8px 12px; font-weight:700; font-size:15px; color:var(--gold2)}

/* ---------- circle of fifths ---------- */
.circle{width:100%; max-width:340px; display:block; margin:6px auto}
.cf-ring{fill:none; stroke:var(--line); stroke-width:1}
.cf-node circle{fill:var(--card2); stroke:var(--line2); stroke-width:1.5; transition:.15s}
.cf-node:active circle{fill:var(--gold); }
.cf-maj{fill:var(--ink); font-weight:800; font-size:13px; text-anchor:middle}
.cf-sig{fill:var(--dim); font-size:8px; text-anchor:middle}
.cf-min circle{fill:var(--bg2); stroke:var(--line); stroke-width:1}
.cf-min text{fill:var(--mut); font-size:9px; text-anchor:middle; font-weight:600}

/* ---------- DRILLS ---------- */
.streak-row{font-size:13px; color:var(--mut); margin:12px 2px 16px}
.streak-row b{color:var(--gold2)}
.drill-list{display:flex; flex-direction:column; gap:8px}
.drill{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px; text-align:left; transition:.12s}
.drill:active{transform:scale(.99); background:var(--card2)}
.d-e{font-size:22px; width:42px; height:42px; display:grid; place-items:center; background:var(--bg2); border-radius:11px; flex:0 0 auto}
.d-body{flex:1}
.d-name{display:block; font-weight:700; font-size:14.5px}
.d-desc{display:block; font-size:11.5px; color:var(--dim); margin-top:2px}
.d-stat{font-size:12px; color:var(--gold2); font-weight:700}
.drill-run{text-align:center}
.dq{font-size:19px; font-weight:700; line-height:1.5; margin:30px 0 26px}
.dq-choices{display:flex; flex-direction:column; gap:9px}
.dq-c{padding:14px; background:var(--card); border:1px solid var(--line2); border-radius:12px; font-size:15px; font-weight:600}
.dq-c.ok{background:rgba(70,211,138,.18); border-color:var(--grn); color:#bff5d8}
.dq-c.ko{background:rgba(255,107,107,.15); border-color:var(--red); color:#ffc6c6}
.dq-fb{margin-top:16px}
.dq-answer .ans{font-size:24px; font-weight:800; color:var(--gold2); background:var(--card); border:1px solid var(--line2); border-radius:13px; padding:20px; margin:6px 0 16px; line-height:1.4}
.grade{display:flex; gap:10px}
.grade .btn{flex:1; padding:14px}

/* ---------- PIANO SVG ---------- */
.piano{width:100%; height:auto; display:block; margin:6px 0; user-select:none}
.pkr{fill:#f4f5fb; stroke:#c9cde0; stroke-width:1}
.pk.on .pkr{fill:var(--goldsoft)}
.pk.root .pkr{fill:var(--gold); stroke:var(--coral); stroke-width:2.5}
.pk .plb{fill:#2a2f4a; font-size:11px; font-weight:700; text-anchor:middle}
.bkr{fill:#20263f; stroke:#0a0d18; stroke-width:1}
.bk.on .bkr{fill:var(--goldsoft)}
.bk.root .bkr{fill:var(--gold); stroke:var(--coral); stroke-width:2}
.bk .plb.bl{fill:#2a2f4a; font-size:9px; font-weight:700; text-anchor:middle}
.pdot{fill:var(--teal); stroke:#0a2a26; stroke-width:1}
.pk .plb{pointer-events:none}
[data-midi]{cursor:pointer}
[data-midi].hit .pkr,[data-midi].hit .bkr{fill:var(--teal)}
[data-midi].hit circle{fill:var(--gold)}

/* ---------- FRETBOARD SVG ---------- */
.fb-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:6px -2px; padding-bottom:6px}
.fretboard{height:auto; display:block; user-select:none}
.fb-wood{fill:#241d31; stroke:none}
.fb-fret{stroke:#5a628c; stroke-width:1.5}
.fb-nut{stroke:#cdd3f0; stroke-width:4}
.fb-string{stroke:#8b93bd; stroke-width:1.2}
.fb-inlay{fill:#3d4676}
.fb-num{fill:var(--dim); font-size:10px; text-anchor:middle}
.fb-open{fill:var(--mut); font-size:10px; font-weight:700; text-anchor:middle}
.fb-note circle{stroke-width:1.5}
.fb-note.scale circle{fill:var(--gold); stroke:var(--coral)}
.fb-note.scale text{fill:#2a1d04; font-size:11px; font-weight:800; text-anchor:middle}
.fb-note.root circle{fill:var(--coral); stroke:#fff; stroke-width:2}
.fb-note.root text{fill:#fff; font-size:11px; font-weight:800; text-anchor:middle}
.fb-note.dot circle{fill:var(--teal); stroke:#0a2a26}
.fb-note.dot text{fill:#06231f; font-size:11px; font-weight:800; text-anchor:middle}
.fb-note.all circle{fill:#2c3457; stroke:#454e7e}
.fb-note.all text{fill:var(--mut); font-size:10px; font-weight:600; text-anchor:middle}

/* ---------- FRETBOARD QUIZ (manche vierge, cases cliquables) ---------- */
.fq-pos circle{fill:rgba(255,255,255,.045); stroke:rgba(255,255,255,.10); stroke-width:1; transition:.12s}
.fq-pos{cursor:pointer}
.fq-pos text{font-size:11px; font-weight:800; text-anchor:middle; pointer-events:none}
.fq-pos.off{pointer-events:none}
.fq-pos.off circle{fill:transparent; stroke:none}
.fq-pos.ok circle{fill:var(--grn); stroke:#0d3324; stroke-width:2}
.fq-pos.ok text{fill:#05261a}
.fq-pos.ko circle{fill:var(--red); stroke:#3a1010; stroke-width:2}
.fq-pos.ko text{fill:#fff}
.fq-pos.lit circle{fill:var(--gold); stroke:var(--coral); stroke-width:2}
.fq-pos.lit text{fill:#2a1d04}
.fq-pos.pen circle{fill:#4b4270; stroke:#7a6fb0; stroke-width:1.5}
.fq-pos.pen text{fill:#e6e2ff}
.fb-string.dim{stroke:#464d70; opacity:.45}
.fb-open.dim{opacity:.35}

/* ---------- ATELIER ---------- */
.ate-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin:0 0 15px; box-shadow:var(--shadow)}
.ate-card.locked{opacity:.75}
.ate-h{display:flex; align-items:flex-start; gap:11px; margin-bottom:13px}
.ate-e{font-size:21px; width:40px; height:40px; display:grid; place-items:center; background:var(--bg2); border:1px solid var(--line); border-radius:11px; flex:0 0 auto}
.ate-t{font-weight:700; font-size:15.5px}
.ate-s{font-size:11.5px; color:var(--dim); margin-top:2px; line-height:1.45}
.ate-s b{color:var(--mut)}
.ate-c{margin-left:auto; font-size:11px; font-weight:800; color:var(--gold2); background:rgba(243,195,74,.1); padding:4px 8px; border-radius:20px; flex:0 0 auto}
.ate-lock{background:var(--bg2); border:1px solid var(--line2); border-radius:10px; padding:9px 11px; font-size:12px; color:var(--mut); margin-bottom:11px}
.kchips{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:9px}
.kchip{padding:10px 0; background:var(--bg2); border:1px solid var(--line); border-radius:10px; font-weight:700; font-size:13.5px; color:var(--dim); position:relative}
.kchip.l1{color:var(--gold2); border-color:rgba(243,195,74,.45); background:rgba(243,195,74,.08)}
.kchip.l2{color:#06231f; background:linear-gradient(135deg,var(--teal),#2fb9a6); border-color:transparent}
.ate-leg{font-size:10.5px; color:var(--dim); display:flex; align-items:center; flex-wrap:wrap; gap:3px; margin-bottom:12px}
.lgd{width:10px; height:10px; border-radius:3px; display:inline-block; background:var(--bg2); border:1px solid var(--line)}
.lgd.l1{background:rgba(243,195,74,.5); border-color:var(--gold)}
.lgd.l2{background:var(--teal); border-color:transparent}
.lgd.due{background:var(--card2); border:2px dashed var(--coral)}
.kchip.due{border:2px dashed var(--coral)}
.kchip.due:after{content:"🔁"; position:absolute; top:-6px; right:-4px; font-size:9px}
.cta.sm{font-size:14px; padding:12px}
.cta.rev{background:linear-gradient(135deg,var(--coral),#e0524f); color:#fff; font-size:13.5px; padding:12px; margin-bottom:8px; box-shadow:0 6px 18px rgba(255,122,92,.28)}
.ate-rows{display:flex; flex-direction:column; gap:7px; margin-top:11px}
.ate-row{display:flex; align-items:center; gap:11px; background:var(--bg2); border:1px solid var(--line); border-radius:11px; padding:11px; text-align:left}
.ate-row:active{background:var(--card2)}
.ar-e{font-size:17px; width:30px; text-align:center; flex:0 0 auto}
.ar-b{flex:1; min-width:0}
.ar-t{display:block; font-weight:650; font-size:13.5px}
.ar-s{display:block; font-size:11px; color:var(--dim); margin-top:1px}
.ar-r{font-size:10.5px; font-weight:700; color:var(--teal); text-align:right; flex:0 0 auto; line-height:1.3}
.ate-sep{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.7px; color:var(--dim); margin:24px 2px 12px; padding-top:14px; border-top:1px solid var(--line)}
.ate-sub{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--violet); margin:16px 2px 8px}

/* rôles de la penta */
.deg-badge{display:inline-block; background:var(--violet); color:#150c33; font-weight:800; font-size:12px; padding:2px 8px; border-radius:20px; vertical-align:2px; margin-left:2px}
.role-card{background:var(--bg2); border:1px solid var(--line2); border-left:3px solid var(--violet); border-radius:0 11px 11px 0; padding:12px 14px; margin-top:10px; text-align:left}
.rc-h{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--violet); margin-bottom:3px}
.rc-h:not(:first-child){margin-top:11px}
.rc-b{font-size:13px; line-height:1.55; color:#dbe0f7}
.rc-b b{color:#fff}
.rc-b i{color:var(--mut)}
.prog-txt2{display:inline-block; font-size:18px; color:var(--gold2); letter-spacing:.5px; margin:8px 0 2px}

/* --- chantier « viser l'accord » --- */
.chase-plan{display:flex; flex-direction:column; gap:6px; margin:14px 0}
.cp{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; color:#dbe0f7}
.cp b{display:inline-grid; place-items:center; width:19px; height:19px; border-radius:50%; background:var(--card2); color:var(--gold2); font-size:10.5px; margin-right:8px}
.splits{display:flex; flex-wrap:wrap; gap:5px; margin:6px 0 2px}
.splits.center{justify-content:center; margin:10px 0 14px}
.sp{font-size:10.5px; font-weight:700; color:var(--teal); background:rgba(57,214,192,.1); border:1px solid rgba(57,214,192,.28); border-radius:20px; padding:4px 9px}
.bouge-band{background:var(--bg2); border:1px solid var(--line2); border-radius:11px; padding:11px 13px; font-size:13px; line-height:1.55; color:#dbe0f7; margin-top:4px}
.bouge-band b{color:var(--gold2)}
.rom{display:inline-block; font-size:10.5px; font-weight:800; color:var(--violet); background:rgba(157,123,255,.14); border-radius:6px; padding:2px 7px; margin-left:4px; vertical-align:1px}
.mapt{display:flex; flex-direction:column; gap:6px; margin-top:9px}
.mapr{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--line2); border-radius:0 10px 10px 0; padding:8px 11px}
.mapr.cible{border-left-color:var(--gold)} .mapr.evite{border-left-color:var(--red)}
.mapr.passage{border-left-color:var(--coral)} .mapr.sure{border-left-color:var(--teal)} .mapr.coul{border-left-color:var(--violet)}
.map-h{display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:700}
.map-n{color:var(--gold2); min-width:30px}
.map-a{color:var(--dim); font-size:12px}
.map-d{color:var(--ink)}
.map-k{margin-left:auto; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; padding:3px 7px; border-radius:20px; white-space:nowrap; background:var(--bg2); color:var(--dim)}
.map-k.cible{background:rgba(243,195,74,.16); color:var(--gold2)}
.map-k.evite{background:rgba(255,107,107,.14); color:#ff9d9d}
.map-k.passage{background:rgba(255,122,92,.14); color:var(--coral)}
.map-k.sure{background:rgba(57,214,192,.12); color:var(--teal)}
.map-k.coul{background:rgba(157,123,255,.14); color:var(--violet)}
.map-x{font-size:11.5px; color:var(--mut); line-height:1.45; margin-top:3px}
.qcard{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:8px}
.qc-h{font-size:15px; font-weight:800; color:var(--gold2); margin-bottom:7px}
.qc-n{font-size:11px; font-weight:600; color:var(--dim); margin-left:6px}
.qc-l{display:flex; gap:9px; align-items:baseline; margin:4px 0}
.qc-k{flex:0 0 82px; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; text-align:right; color:var(--dim)}
.qc-k.cible{color:var(--gold2)} .qc-k.evite{color:#ff9d9d} .qc-k.sure{color:var(--teal)} .qc-k.coul{color:var(--violet)}
.qc-v{font-size:13px; color:#dbe0f7; font-weight:600}
.qc-x{font-size:11.5px; color:var(--mut); line-height:1.5; margin-top:9px; padding-top:9px; border-top:1px solid var(--line)}

/* --- feuille d'exercice --- */
.ex-chap{font-size:12px; color:var(--dim); margin-left:auto}
.ex-time{font-size:12px; font-weight:800; color:var(--gold2); font-variant-numeric:tabular-nums; min-width:52px; text-align:right}
.ex-intro{font-size:13px; color:var(--mut); line-height:1.5; margin-bottom:12px}
.ex-intro.big{font-size:15px; color:var(--ink); font-weight:600}
.ex-intro b{color:var(--ink)}
.ex-hint2{font-size:11px; color:var(--dim); text-align:center; margin:-2px 0 14px}
.dq.sm{font-size:16px; margin:18px 0 16px}
.dq-hint{display:block; font-size:11.5px; color:var(--dim); font-weight:400; margin-top:5px}
.ecl-top{font-size:12px; color:var(--dim); text-align:center; margin-bottom:2px}
.ecl-top b{color:var(--gold2)}
.dq-c[data-n],.dq-c[data-i]{transition:.1s}

/* ruban de la formule */
.ribbon{display:flex; align-items:center; justify-content:center; gap:1px; flex-wrap:nowrap; margin:4px 0 6px}
.rb-deg{width:21px; height:21px; border-radius:50%; display:grid; place-items:center; font-size:10.5px; font-weight:800; background:var(--bg2); border:1px solid var(--line); color:var(--dim); flex:0 0 auto}
.rb-deg.on{background:var(--gold); border-color:var(--gold); color:#2a1d04}
.rb-step{font-size:10px; font-weight:800; color:var(--dim); padding:0 2px; flex:0 0 auto}
.rb-step.cur{color:var(--coral); transform:scale(1.35)}

/* chips de construction */
.bchips{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin:14px 0}
.bchip{min-width:44px; padding:9px 6px; text-align:center; border-radius:9px; background:var(--bg2); border:1px solid var(--line); color:var(--dim); font-weight:700; font-size:14px}
.bchip.on{background:var(--card2); border-color:var(--line2); color:var(--gold2)}
.bchip.cur{border-color:var(--coral); border-style:dashed; color:var(--ink); background:rgba(255,122,92,.1)}
.bchip .q{color:var(--coral); margin-left:1px}

/* boutons d'altération */
.acc-row{display:flex; gap:8px}
.acc-b{flex:1; padding:16px 4px; background:var(--card); border:1px solid var(--line2); border-radius:13px; display:flex; flex-direction:column; align-items:center; gap:4px}
.acc-s{font-size:21px; color:var(--mut); line-height:1}
.acc-n{font-size:16px; font-weight:800}
.acc-b.ok{background:rgba(70,211,138,.18); border-color:var(--grn); color:#bff5d8}
.acc-b.ko{background:rgba(255,107,107,.15); border-color:var(--red); color:#ffc6c6}

/* chips de degrés (exo « retire les deux ») */
.degchips{display:flex; gap:20px 6px; flex-wrap:wrap; justify-content:center; margin:16px 0}
.dchip{position:relative; min-width:52px; padding:14px 8px 10px; border-radius:11px; background:var(--card); border:1px solid var(--line2); font-weight:700; font-size:15px; color:var(--ink)}
.dc-n{position:absolute; top:3px; left:0; right:0; font-size:9px; color:var(--dim); font-weight:800}
.dchip.sel{background:rgba(255,122,92,.18); border-color:var(--coral)}
.dchip.bad{background:rgba(255,107,107,.16); border-color:var(--red); color:#ffc6c6; text-decoration:line-through}
.dchip.keep{background:rgba(243,195,74,.14); border-color:var(--gold); color:var(--gold2)}
.dchip.wrongpick{background:rgba(243,195,74,.14); border:2px dashed var(--coral); color:var(--gold2)}
.dchip.wrongpick:after{content:"ton choix"; position:absolute; bottom:-15px; left:0; right:0; font-size:8.5px; color:var(--coral); font-weight:700}
.degchips{padding-bottom:16px}

/* écrans de victoire */
.ex-win{text-align:center; padding-top:6px}
.win-big{font-size:32px; font-weight:800; background:linear-gradient(90deg,var(--gold2),var(--coral));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; line-height:1.2}
.win-sub{font-size:13px; color:var(--mut); margin:4px 0 16px}
.win-sub b{color:var(--gold2)}
.scale-notes.center{justify-content:center}
.btnrow.center{justify-content:center}
.ex-win .hint,.ex-win .fb-ok,.ex-win .fb-ko{text-align:left}
.ex-win .btn.big{margin-top:9px}
.pen-two{display:grid; gap:14px; margin:6px 0 4px}
.rules{margin:0 0 14px; padding-left:20px; font-size:13.5px; line-height:1.6; color:#dbe0f7}
.rules li{margin:8px 0}
.rules b{color:var(--gold2)}

/* ---------- SÉANCE DU JOUR ---------- */
.se-card{background:linear-gradient(150deg,#1d2a4c,#161b36); border:1px solid rgba(57,214,192,.35); border-radius:var(--r); padding:16px; margin:16px 0; box-shadow:var(--shadow)}
.se-h{display:flex; align-items:flex-start; gap:10px; margin-bottom:11px}
.se-title{font-size:18px; font-weight:800}
.se-sub{font-size:11.5px; color:var(--dim); margin-top:3px; line-height:1.45}
.se-count{margin-left:auto; font-size:20px; font-weight:800; color:var(--teal); font-variant-numeric:tabular-nums}
.se-card .prog-bar span{background:linear-gradient(90deg,var(--teal),var(--gold))}
.se-rows{display:flex; flex-direction:column; gap:7px; margin-top:12px}
.se-row{display:flex; align-items:center; gap:11px; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:11px; text-align:left; transition:.12s}
.se-row:active{transform:scale(.99)}
.se-row.cur{border-color:var(--teal); background:rgba(57,214,192,.07)}
.se-row.ok{opacity:.6}
.se-n{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; background:var(--card2); color:var(--mut); flex:0 0 auto}
.se-row.cur .se-n{background:var(--teal); color:#06231f}
.se-row.ok .se-n{background:rgba(70,211,138,.18); color:var(--grn)}
.se-b{flex:1; min-width:0}
.se-cat{display:block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--dim)}
.se-t{display:block; font-weight:700; font-size:14px; margin-top:2px}
.se-w{display:block; font-size:11.5px; color:var(--mut); margin-top:2px; line-height:1.4}
.se-week{display:flex; align-items:flex-end; gap:7px; margin-top:13px; font-size:10px; color:var(--dim); font-weight:700}
.se-d{display:flex; flex-direction:column; align-items:center; gap:3px}
.se-dot{width:15px; height:15px; border-radius:4px; background:var(--bg2); border:1px solid var(--line)}
.se-dot.part{background:rgba(57,214,192,.35); border-color:transparent}
.se-dot.full{background:var(--teal); border-color:transparent}
.se-d.today{color:var(--gold2)}
.se-streak{margin-left:auto; font-size:11.5px; font-weight:600; color:var(--mut)}
.se-streak b{color:var(--gold2)}
.jam-t{font-size:48px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; color:var(--teal); margin:16px 0 4px}
#jamFb .fb-ok{margin-bottom:6px}

/* ---------- legend ---------- */
.fq-leg{margin-top:2px}
.fq-sw{width:13px; height:13px; border-radius:50%; display:inline-block; box-sizing:border-box}
.fq-sw.pen{background:#4b4270; border:1.5px solid #7a6fb0}
.fq-sw.ok{background:var(--grn); border:1.5px solid #0d3324}
.fq-sw.ko{background:var(--red); border:1.5px solid #3a1010}
.fq-sw.lit{background:var(--gold); border:1.5px solid var(--coral)}
.legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:8px 0 2px; font-size:11.5px; color:var(--mut)}
.lg{display:flex; align-items:center; gap:5px}
.lg-sw{width:13px; height:13px; border-radius:50%; display:inline-block}
.lg-sw.lg-fill{background:var(--gold)}
.lg-sw.lg-dot{background:var(--teal)}
.lg-sw.lg-root{background:var(--coral); border:2px solid #fff}

/* ===== Les modes dans l'Impro ===== */
.mchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;margin:4px 0 12px}
.mchip{background:var(--card2);border:1px solid transparent;border-radius:11px;padding:8px 6px;cursor:pointer;
  color:var(--mut);font-family:inherit;text-align:center;line-height:1.25;transition:.13s}
.mchip b{display:block;font-size:12.5px;font-weight:800;color:var(--ink)}
.mchip small{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.mchip.on{background:var(--gold);border-color:var(--gold2)}
.mchip.on b,.mchip.on small{color:#171a2c}
.mcard{background:var(--card2);border-radius:14px;padding:14px 15px;margin-bottom:14px}
.mc-h{font-size:16px;font-weight:800;display:flex;flex-wrap:wrap;align-items:baseline;gap:7px}
.mc-alias{font-size:12px;color:var(--dim);font-weight:600}
.mc-chord{margin-left:auto;font-size:12px;font-weight:800;color:var(--gold);
  background:rgba(243,195,74,.13);padding:3px 9px;border-radius:7px}
.mc-notes{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 9px}
.mc-notes span{font-size:13px;font-weight:750;color:var(--mut);background:var(--card);padding:4px 9px;border-radius:7px}
.mc-notes span.rt{background:var(--gold);color:#171a2c;font-weight:900}
.mc-notes span.car{background:var(--teal);color:#06231f;font-weight:900}
.mc-car{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px}
.mc-car b{color:var(--teal)}
.mc-deg{color:var(--dim);font-weight:600;font-size:12px}
.mc-row{display:flex;gap:9px;font-size:12.5px;line-height:1.5;color:var(--mut);margin-top:6px}
.mc-row.tip{color:var(--ink)}
.mc-lbl{flex:0 0 60px;color:var(--dim);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-top:2px}
.mnote{font-size:12.5px;line-height:1.6;color:var(--mut);background:rgba(157,123,255,.10);
  border-left:3px solid var(--violet);border-radius:9px;padding:11px 13px;margin-top:12px}
.mnote b{color:var(--ink)}
</style>
</head>
